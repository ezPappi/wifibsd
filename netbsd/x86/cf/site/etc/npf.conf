# See npf.conf(5), npf-params(7) and /usr/share/examples/npf for syntax
# and examples.
# Unlike pf, rule order is free: define variables and tables first, then
# NAT (map), procedures and groups.  Filter rules are last match unless
# marked "final".

# Variables: define common values, so they can be referenced and changed easily.
$ext_if = "ath0"	# replace with actual external interface name i.e., wm0
$int_if = "sip0"	# replace with actual internal interface name i.e., wm1
$internal_net = { 192.168.100.0/24 }
#$external_addr = { 192.168.1.1 }

# Tables: similar to variables, but can be changed at run time with
# "npfctl table <name> add|del <addr>".  Use type lpm for networks.
#table <foo> type lpm file "/etc/npf_foo"

# Parameters: tune the behavior of npf, see npf-params(7) for the full list.
#set state.tcp.timeout.established 86400
#set state.tcp.timeout.close 10
#set state.generic.timeout 60

# Normalization: reassemble IPv4 fragments before inspecting them.
# This is what "scrub in all" did under pf, and is on by default in npf.
set ip4.reassembly on

# Queueing: npf does not do bandwidth control.  The kernel still has ALTQ;
# configure it with altqd(8) and /etc/altq.conf.

# Let ICMP errors (e.g. traceroute replies) find their way back through NAT.
alg "icmp"

# Translation: specify how addresses are to be mapped or redirected.
# Packets going out through $ext_if with source address $internal_net get
# translated to the address of $ext_if.  ifaddrs() follows the interface
# address if it changes, e.g. via DHCP.
map $ext_if dynamic $internal_net -> ifaddrs($ext_if)

# Redirect: packets coming in on $ext_if for $external_addr port 1234 go to
# 10.1.1.1 port 5678.  A filter rule must still pass the traffic.
#map $ext_if dynamic proto tcp 10.1.1.1 port 5678 <- $external_addr port 1234

# The pf ftp-proxy and spamd examples have no npf equivalent.

# Logging: send matching packets to npflog0; npfd(8) writes them to
# /var/log/npflog0.pcap.  Add 'apply "log"' to any rule to log it.
procedure "log" {
	log: npflog0
}

# Filtering: pass everything, as the pf rules did.
group default {
	pass final on lo0 all
	pass all
}

